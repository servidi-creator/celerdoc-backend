services:
  - type: web
    name: celerdoc-backend
    env: python
    plan: standard
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn index:app --host 0.0.0.0 --port $PORT --workers 4"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CELERDOC_CORP_API_KEY
        generateValue: true
